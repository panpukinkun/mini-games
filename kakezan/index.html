<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
  <title>掛け算忍者 〜九九の巻〜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
  :root {
    --ink: #2b2b2b;
    --paper: #f5ecd9;
    --red: #d64541;
    --red-dark: #a93226;
    --gold: #f4c430;
    --gold-light: #fdebd0;
    --cream: #fff8ec;
    --sky: #7ec8e3;
    --green: #52b788;
    --blue: #5dade2;
    --line: #b89b6e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #fdebd0 0%, #fdf2e3 40%, #fdebd0 100%);
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
    overflow: hidden;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
  }
  #app {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .screen {
    width: 100%; max-width: 860px; height: 100%; max-height: 1100px;
    display: none; flex-direction: column;
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, #ffe9c9 0%, #fff8ec 55%, #eaf6ff 100%);
    border-radius: 0;
  }
  .screen.active { display: flex; }
  @media (min-width: 700px) and (min-height: 600px) {
    .screen { border-radius: 28px; box-shadow: 0 10px 40px rgba(120, 70, 20, 0.25); }
    #app { padding: 12px; }
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; gap: 8px;
    background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.4));
    border-bottom: 2px dashed rgba(214, 69, 65, 0.25);
    z-index: 5;
  }
  .topbar .hud {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 2px solid rgba(214,69,65,0.25);
    border-radius: 999px; padding: 4px 14px;
    font-weight: 800; font-size: 15px;
  }
  .topbar .hud .num { color: var(--red); }
  .btn {
    border: none; cursor: pointer;
    font-family: inherit; font-weight: 800;
    border-radius: 999px;
    background: linear-gradient(180deg, #f77f6b, #d64541);
    color: #fff; padding: 10px 26px; font-size: 18px;
    box-shadow: 0 5px 0 #a93226, 0 8px 14px rgba(169,50,38,0.3);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #a93226, 0 2px 6px rgba(169,50,38,0.3); }
  .btn.gold { background: linear-gradient(180deg, #ffd97d, #f5b041); color: #5a3e00; box-shadow: 0 5px 0 #c98f1b, 0 8px 14px rgba(201,143,27,0.35); }
  .btn.gold:active { box-shadow: 0 1px 0 #c98f1b, 0 2px 6px rgba(201,143,27,0.35); }
  .btn.green { background: linear-gradient(180deg, #7fd8ab, #52b788); box-shadow: 0 5px 0 #3b9166, 0 8px 14px rgba(59,145,102,0.3); }
  .btn.green:active { box-shadow: 0 1px 0 #3b9166, 0 2px 6px rgba(59,145,102,0.3); }
  .btn.big { font-size: 22px; padding: 14px 40px; }
  .btn.icon { padding: 8px 14px; font-size: 16px; }

  /* ---- タイトル ---- */
  #titleScreen { align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 20px; }
  .logo-wrap { position: relative; margin-bottom: 6px; }
  .logo { font-size: 54px; font-weight: 900; letter-spacing: 2px; line-height: 1.15;
    color: #fff; text-shadow: 0 3px 0 var(--red-dark), 0 6px 0 rgba(169,50,38,0.4), 0 10px 20px rgba(169,50,38,0.35); }
  .logo .small { display: block; font-size: 22px; font-weight: 800; color: var(--gold); text-shadow: 0 2px 0 #7a4d00; margin-top: 2px; }
  .title-master { font-size: 46px; animation: bob 2s infinite ease-in-out; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .title-tag { font-size: 15px; color: #7a5a3a; margin-top: 6px; font-weight: 700; }
  .title-sakura { position: absolute; width: 18px; height: 18px; background: #f7b7c8; border-radius: 60% 40% 55% 45% / 60% 50% 50% 40%; animation: fall 6s linear infinite; opacity: 0.85; }
  @keyframes fall { 0% { transform: translateY(-40px) rotate(0); } 100% { transform: translateY(140vh) rotate(360deg); } }
  .version { position: absolute; bottom: 14px; font-size: 11px; color: #b39b80; }

  /* ---- プレイヤー選択 ---- */
  #slotScreen { padding: 20px; align-items: center; }
  .screen-title { font-size: 26px; font-weight: 900; color: var(--red); text-shadow: 0 2px 0 rgba(255,255,255,0.8); margin-bottom: 4px; text-align: center; }
  .screen-sub { font-size: 14px; color: #8a6a4a; font-weight: 700; text-align: center; margin-bottom: 16px; }
  .slot-list { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 460px; }
  .slot {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border: 3px solid #e8d5b8; border-radius: 20px; padding: 12px 16px;
    cursor: pointer; transition: transform 0.1s, border-color 0.1s; position: relative;
  }
  .slot:hover { transform: scale(1.02); border-color: var(--gold); }
  .slot .avatar { font-size: 40px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: var(--gold-light); border-radius: 50%; }
  .slot .meta { flex: 1; text-align: left; }
  .slot .meta .name { font-size: 20px; font-weight: 900; }
  .slot .meta .info { font-size: 12px; color: #9a7a5a; font-weight: 700; }
  .slot.empty { border-style: dashed; color: #b09a7c; justify-content: center; }
  .slot.empty .name { color: #b09a7c; }
  .slot .delete { position: absolute; top: 6px; right: 10px; background: none; border: none; font-size: 16px; color: #d0b8a0; cursor: pointer; padding: 4px; }
  .slot .delete:hover { color: var(--red); }
  .name-modal { position: absolute; inset: 0; background: rgba(70,40,10,0.5); display: none; align-items: center; justify-content: center; z-index: 20; }
  .name-modal.active { display: flex; }
  .name-modal .box { background: #fff; border-radius: 24px; padding: 26px 24px; width: 88%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
  .name-modal input { width: 100%; font-size: 22px; padding: 10px 14px; border: 3px solid var(--gold); border-radius: 12px; text-align: center; font-family: inherit; margin: 14px 0; outline: none; }
  .name-modal .row { display: flex; gap: 10px; justify-content: center; }

  /* ---- 段マップ ---- */
  #mapScreen { padding: 14px; }
  .map-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 10px 4px 80px; align-content: start; }
  .map-cell {
    background: #fff; border: 3px solid #e8d5b8; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 4px; cursor: pointer; transition: transform 0.1s; position: relative;
  }
  .map-cell:hover { transform: scale(1.03); }
  .map-cell .dan { font-size: 13px; font-weight: 800; color: #a08060; }
  .map-cell .emoji { font-size: 34px; }
  .map-cell .name { font-size: 11px; font-weight: 800; color: var(--ink); }
  .map-cell .medals { font-size: 13px; margin-top: 2px; }
  .map-cell.locked { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.6); }
  .map-cell.current { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(245,176,65,0.35); }
  .map-cell.cleared { border-color: var(--green); background: #f0faf4; }
  .map-cell.complete .emoji::after { content: "⭐"; }

  /* ---- ステージ導入 ---- */
  #introScreen { align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 14px; }
  .master-big { font-size: 110px; line-height: 1.1; animation: bob 1.8s infinite ease-in-out; }
  .master-name { font-size: 30px; font-weight: 900; color: var(--red); }
  .speech {
    background: #fff; border: 3px solid var(--gold); border-radius: 22px; padding: 14px 18px;
    font-size: 17px; font-weight: 700; line-height: 1.6; max-width: 420px; position: relative;
    box-shadow: 0 4px 12px rgba(120,70,20,0.15);
  }
  .speech::before { content: ""; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); border: 8px solid transparent; border-bottom-color: var(--gold); }
  .stage-badge { font-size: 15px; font-weight: 900; background: var(--red); color: #fff; padding: 5px 18px; border-radius: 999px; }
  .stage-badge.train { background: var(--blue); }
  .stage-badge.boss { background: #6c3483; }

  /* ---- 出題 ---- */
  #playScreen { position: relative; }
  .enemy-zone { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 200px; }
  .enemy-wrap { text-align: center; position: relative; }
  .enemy-emoji { font-size: 96px; transition: transform 0.1s; animation: floaty 1.6s infinite ease-in-out; display: inline-block; }
  .enemy-emoji.hurt { animation: shake 0.4s; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-6px,0); } 75% { transform: translate(6px,0); } }
  .enemy-emoji.hit { animation: hitpop 0.35s; }
  @keyframes hitpop { 0% { transform: scale(1); filter: brightness(2); } 100% { transform: scale(1.08); } }
  .q-balloon {
    background: #fff; border: 3px solid var(--gold); border-radius: 18px;
    padding: 10px 22px; font-size: 34px; font-weight: 900; color: var(--ink);
    box-shadow: 0 4px 12px rgba(120,70,20,0.2); display: inline-block; margin-top: 6px;
    min-width: 200px;
  }
  .q-balloon .q { color: var(--red); }
  .boss-hpbar { width: 70%; max-width: 340px; height: 18px; background: rgba(0,0,0,0.15); border-radius: 999px; margin: 8px auto 0; overflow: hidden; border: 2px solid #fff; }
  .boss-hpbar .fill { height: 100%; background: linear-gradient(90deg, #ffd97d, #d64541); width: 100%; transition: width 0.3s; }
  .choice-pad { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .choice {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border: none; border-radius: 22px; padding: 18px; font-size: 30px; font-weight: 900;
    cursor: pointer; color: #fff; position: relative; transition: transform 0.08s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.22), 0 8px 16px rgba(0,0,0,0.12);
  }
  .choice:active { transform: scale(0.96); }
  .choice .mark { font-size: 18px; opacity: 0.85; }
  .choice .val { flex: 1; text-align: left; }
  .choice.c1 { background: linear-gradient(180deg, #f77f6b, #d64541); }
  .choice.c2 { background: linear-gradient(180deg, #7fd8ab, #52b788); }
  .choice.c3 { background: linear-gradient(180deg, #8ec8f2, #5dade2); }
  .choice.correct { background: linear-gradient(180deg, #ffd97d, #f5b041) !important; color: #5a3e00; }
  .choice.wrong { background: #9e9e9e !important; }
  .feedback { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0);
    font-size: 24px; font-weight: 900; z-index: 10; pointer-events: none; text-align: center;
    max-width: 88vw; line-height: 1.35; white-space: normal; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .feedback.show { animation: feedbackpop 0.7s forwards; }
  @keyframes feedbackpop { 0% { transform: translate(-50%,-50%) scale(0.6); opacity: 1; } 60% { transform: translate(-50%,-58%) scale(1.05); opacity: 1; } 100% { transform: translate(-50%,-78%) scale(1); opacity: 0; } }
  .feedback.good { color: var(--gold); }
  .feedback.bad { color: var(--red); }
  .combo-float { position: absolute; top: 16%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; color: var(--gold); z-index: 9; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }

  /* ---- おにぎり学習 ---- */
  #learnScreen { align-items: center; padding: 16px; }
  .learn-title { font-size: 22px; font-weight: 900; color: var(--red); text-align: center; }
  .learn-q { font-size: 30px; font-weight: 900; text-align: center; margin: 6px 0; }
  .gameover-emoji { font-size: 70px; }
  .gameover-title { font-size: 28px; font-weight: 900; color: var(--red); margin: 8px 0; }
  .gameover-sub { font-size: 15px; color: #8a6a4a; font-weight: 700; }
  /* カード詳細モーダル */
  .modal-overlay { position: fixed; inset: 0; background: rgba(40,20,10,0.6); display: flex; align-items: center; justify-content: center; z-index: 9998; padding: 20px; }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: #fff8ec; border: 4px solid var(--gold); border-radius: 22px; max-width: 360px; width: 100%; padding: 22px 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.3); text-align: center; }
  .modal-close { position: absolute; top: 10px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--red); color: #fff; font-size: 16px; cursor: pointer; }
  .modal-emoji { margin: 6px 0; }
  .modal-name { font-size: 24px; font-weight: 900; color: #5a3e00; }
  .modal-trait { font-size: 14px; color: var(--red); font-weight: 800; margin: 6px 0; }
  .modal-line { font-size: 14px; color: #6a4a2a; margin: 4px 0; }
  .modal-status { font-size: 13px; font-weight: 800; margin-top: 10px; padding: 6px; border-radius: 10px; }
  .modal-status.got { background: #fff0c8; color: #b9791a; }
  .modal-status.ng { background: #eee; color: #999; }
  .card-item { cursor: pointer; }
  .learn-q.correct-answer { color: #fff; background: linear-gradient(180deg, var(--gold), #e8a000); border-radius: 14px; padding: 10px 0; box-shadow: 0 4px 0 #b9791a; }
  #muteBtn { position: fixed; top: 58px; right: 10px; z-index: 9999; width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; background: var(--red); color: #fff; font-size: 18px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #muteBtn:active { transform: translateY(2px); }
  .onigiri-area { flex: 1; overflow-y: auto; width: 100%; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .og-group { display: flex; flex-direction: column; gap: 4px; align-items: center; border: 3px solid #e8d5b8; border-radius: 18px; padding: 8px; background: #fff; transition: all 0.3s; cursor: pointer; }
  .og-group .og-row { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .og-group .og { font-size: 24px; transition: transform 0.15s; }
  .og-group.hl { border-color: var(--gold); background: var(--gold-light); box-shadow: 0 0 0 4px rgba(245,176,65,0.3); }
  .og-group.hl .og { transform: scale(1.15); }
  .og-count { font-size: 20px; font-weight: 900; color: var(--red); }
  .learn-guide { font-size: 13px; color: #8a6a4a; text-align: center; margin: 6px 0; font-weight: 700; }

  /* ---- クリア ---- */
  #clearScreen { align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 10px; }
  .clear-emoji { font-size: 80px; animation: bob 1.4s infinite ease-in-out; }
  .clear-title { font-size: 30px; font-weight: 900; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .medal-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
  .medal { font-size: 56px; animation: pop 0.5s backwards; }
  .medal.silver { animation-delay: 0.15s; }
  .medal.bronze { animation-delay: 0.3s; }
  @keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.3) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
  .card-reward { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid var(--gold); border-radius: 18px; padding: 10px 18px; margin-top: 4px; }
  .card-reward .c-emoji { font-size: 40px; }
  .card-reward .c-name { font-weight: 900; font-size: 16px; }
  .card-reward .c-new { background: var(--red); color: #fff; font-size: 12px; font-weight: 900; padding: 2px 10px; border-radius: 999px; }
  .stage-progress { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .stage-dot { width: 14px; height: 14px; border-radius: 50%; background: #e0cdb0; border: 2px solid #fff; }
  .stage-dot.done { background: var(--green); }
  .stage-dot.now { background: var(--gold); }
  .stage-dot.lock { background: #ddd; }

  /* ---- カード ---- */
  #cardScreen { padding: 14px; }
  .card-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 10px 4px 80px; }
  .card-item { background: #fff; border: 3px solid #e8d5b8; border-radius: 18px; padding: 12px 6px; text-align: center; }
  .card-item .c-emoji { font-size: 40px; }
  .card-item .c-name { font-size: 12px; font-weight: 900; margin-top: 4px; }
  .card-item.got { border-color: var(--gold); background: linear-gradient(180deg, #fff8ec, #fff); }
  .card-item.ng { filter: grayscale(1); opacity: 0.5; }
  .card-item .c-new { position: absolute; }

  /* ---- 成績表 ---- */
  #recordScreen { padding: 14px; }
  .record-wrap { flex: 1; overflow-y: auto; padding: 6px 4px 90px; }
  .record-card { background: #fff; border: 3px solid #e8d5b8; border-radius: 18px; padding: 12px 14px; margin-bottom: 12px; }
  .record-card .row-head { display: flex; justify-content: space-between; align-items: center; font-weight: 900; }
  .record-card .dan-name { font-size: 17px; }
  .record-card .medals { font-size: 14px; }
  .record-card .bars { margin-top: 6px; }
  .bar-row { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-top: 3px; }
  .bar-row .lbl { width: 44px; color: #8a6a4a; }
  .bar-row .bar-bg { flex: 1; height: 10px; background: #f0e5d5; border-radius: 999px; overflow: hidden; }
  .bar-row .bar { height: 100%; border-radius: 999px; }
  .bar-row .val { width: 40px; text-align: right; }
  .bar.good { background: var(--green); }
  .bar.bad { background: var(--red); }
  .weak-note { background: var(--gold-light); border: 2px solid var(--gold); border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 800; color: #7a5a1a; margin-bottom: 12px; }

  /* ---- ボーナス ---- */
  #bonusScreen { align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 12px; }
  .bonus-emoji { font-size: 90px; animation: bob 1.2s infinite ease-in-out; }

  .footer-nav { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; padding: 12px; background: rgba(255,255,255,0.85); border-top: 2px dashed rgba(214,69,65,0.2); z-index: 5; }
  .hidden { display: none !important; }
  .disabled { pointer-events: none; opacity: 0.5; }

  /* ===== 本家「掛け算忍者」風の追加演出 ===== */
  /* トップ画面の9人の先生 */
  .master-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin: 8px 0 4px; }
  .master-row .m { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(120,70,20,0.3)); }
  /* 先生の吹き出し（問題文） */
  .master-speech {
    background: #fff; border: 4px solid var(--gold); border-radius: 20px;
    padding: 12px 18px; font-size: 26px; font-weight: 900; color: var(--ink);
    margin: 6px auto; max-width: 340px; position: relative; text-align: center;
    box-shadow: 0 5px 0 rgba(214,69,65,0.15), 0 8px 16px rgba(120,70,20,0.2);
  }
  .master-speech::before {
    content: ""; position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    border: 9px solid transparent; border-bottom-color: var(--gold);
  }
  /* 手裏剣飛行エフェクト */
  .shuriken-fly {
    position: absolute; font-size: 42px; z-index: 30; pointer-events: none;
    left: 50%; top: 70%;
    animation: shurikenFly 0.45s cubic-bezier(.3,.7,.4,1) forwards;
  }
  @keyframes shurikenFly {
    0% { transform: translate(-50%,-50%) rotate(0) scale(0.6); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(720deg) scale(1.1); opacity: 0; }
  }
  .slash {
    position: absolute; font-size: 70px; z-index: 28; pointer-events: none; left: 50%; top: 35%;
    transform: translate(-50%,-50%) scale(0); opacity: 0;
    animation: slashPop 0.5s ease-out forwards;
  }
  @keyframes slashPop { 0% { transform: translate(-50%,-50%) scale(0) rotate(-30deg); opacity: 1; }
    70% { transform: translate(-50%,-50%) scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: translate(-50%,-60%) scale(1) rotate(0); opacity: 0; } }
  /* ボス戦背景（炎） */
  .boss-bg {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(circle at 50% 35%, rgba(214,69,65,0.45), transparent 70%);
    animation: bossPulse 1.1s ease-in-out infinite alternate;
  }

  // ============ オリジナル忍者キャラ（SVG） ============
  const ANIMAL = { 1:"dog", 2:"chick", 3:"parrot", 4:"robot", 5:"bear", 6:"kunoichi", 7:"cat", 8:"mouse", 9:"dragon" };
  function makeNinja(dan, size) {
    const animal = ANIMAL[dan] || "dog";
    const ear = {
      dog:"#b5651d", chick:"#f7c948", parrot:"#3498db", robot:"#95a5a6",

    }[animal];
    const accent = {
      dog:"#b5651d", chick:"#f7c948", parrot:"#3498db", robot:"#7f8c8d",
      bear:"#a0522d", kunoichi:"#e75480", cat:"#5dade2", mouse:"#9e9e9e", dragon:"#27ae60"
    }[animal];
    const head = "#d64541";
    let ears = "";
    if (animal === "dog") ears = `<path d="M22,55 Q6,84 30,90 Q34,66 42,54 Z" fill="${ear}"/><path d="M98,55 Q114,84 90,90 Q86,66 78,54 Z" fill="${ear}"/>`;
    else if (animal === "bear" || animal === "mouse") ears = `<circle cx="27" cy="40" r="14" fill="${ear}"/><circle cx="93" cy="40" r="14" fill="${ear}"/>`;
    else if (animal === "cat") ears = `<path d="M24,52 L16,20 L48,44 Z" fill="${ear}"/><path d="M96,52 L104,20 L72,44 Z" fill="${ear}"/>`;
    else if (animal === "robot") ears = `<line x1="40" y1="26" x2="28" y2="6" stroke="${ear}" stroke-width="4"/><circle cx="28" cy="5" r="5" fill="${ear}"/><line x1="80" y1="26" x2="92" y2="6" stroke="${ear}" stroke-width="4"/><circle cx="92" cy="5" r="5" fill="${ear}"/>`;
    else if (animal === "dragon") ears = `<path d="M34,32 Q16,-2 52,16 Q42,28 46,42 Z" fill="${ear}" stroke="#1e8449" stroke-width="2"/><path d="M86,32 Q104,-2 68,16 Q78,28 74,42 Z" fill="${ear}" stroke="#1e8449" stroke-width="2"/>`;
    else if (animal === "chick" || animal === "parrot") ears = `<path d="M58,66 L76,80 L58,92 Z" fill="#e67e22"/>`;
    else if (animal === "kunoichi") ears = `<path d="M20,42 Q8,14 38,30 Q30,46 42,54 Z" fill="${ear}"/><path d="M100,42 Q112,14 82,30 Q90,46 78,54 Z" fill="${ear}"/><circle cx="60" cy="12" r="9" fill="${accent}"/>`;
    const w = size || 96;
    return `<svg viewBox="0 0 120 132" width="${w}" height="${Math.round(w*1.1)}" class="ninja-svg">
      ${ears}
      <path d="M16,64 Q60,6 104,64 L104,78 Q60,46 16,78 Z" fill="${head}"/>
      <circle cx="60" cy="70" r="33" fill="#ffe0bd"/>
      <rect x="40" y="64" width="40" height="8" rx="4" fill="#2b2b2b"/>

  // 主人公（プレイヤー忍者）
  const HERO_SVG = `<svg viewBox="0 0 120 132" width="92" height="101" class="ninja-svg hero">
    <path d="M22,55 Q6,84 30,90 Q34,66 42,54 Z" fill="#2b2b2b"/><path d="M98,55 Q114,84 90,90 Q86,66 78,54 Z" fill="#2b2b2b"/>
    <path d="M16,64 Q60,6 104,64 L104,78 Q60,46 16,78 Z" fill="#34495e"/>
    <circle cx="60" cy="70" r="33" fill="#ffe0bd"/>
    <rect x="40" y="64" width="40" height="8" rx="4" fill="#2b2b2b"/>
    <path d="M24,100 Q60,120 96,100 L96,114 Q60,132 24,114 Z" fill="#5dade2"/>
  </svg>`;

  // ============ ステージ定義 ============
  const STAGES = [
    { key: "practice", label: "修行", badge: "practice", mode: "sequence", count: 9 },
    { key: "train1", label: "実践", badge: "train", mode: "random", count: 6 },
    { key: "train2", label: "実践", badge: "train", mode: "random", count: 6 },
    { key: "boss", label: "ボス戦", badge: "boss", mode: "random", count: 6 }
  ];
  const BOSS_HP = 6;              // ボスのHP
  const PLAYER_LIVES = 3;         // ハート数

  // ============ 音声 ============
  // 九九の読み方（童謡風・連声込みの正しい暗唱。出典：童謡童話王国「九九の歌」/ 山野さと子「99のうた」/ ACTABA）
  // KUKU[a][b] = a×b の暗唱。正統な九九のうたの流し方では、答えが1桁(1〜9)のときだけ「が」を入れ、答えが2桁以上（「じゅう」を含む）のときは入れない。
  const KUKU = {
    1: {1:"いんいちがいち",2:"いんにがに",3:"いんさんがさん",4:"いんしがし",5:"いんごがご",6:"いんろくがろく",7:"いんしちがしち",8:"いんはちがはち",9:"いんくがく"},
    2: {1:"にいちがに",2:"ににんがし",3:"にさんがろく",4:"にしがはち",5:"にごじゅう",6:"にろくじゅうに",7:"にしちじゅうし",8:"にはちじゅうろく",9:"にくじゅうはち"},
    3: {1:"さんいちがさん",2:"さんにがろく",3:"さざんがく",4:"さんしじゅうに",5:"さんごじゅうご",6:"さぶろくじゅうはち",7:"さんしちにじゅういち",8:"さんぱにじゅうし",9:"さんくにじゅうしち"},
    4: {1:"しいちがし",2:"しにがはち",3:"しさんじゅうに",4:"ししじゅうろく",5:"しごにじゅう",6:"しろくにじゅうし",7:"ししちにじゅうはち",8:"し はさんじゅうに",9:"しくさんじゅうろく"},
    5: {1:"ごいちがご",2:"ごにじゅう",3:"ごさんじゅうご",4:"ごしにじゅう",5:"ごごにじゅうご",6:"ごろくさんじゅう",7:"ごしちさんじゅうご",8:"ご はしじゅう",9:"ごっくしじゅうご"},
    6: {1:"ろくいちがろく",2:"ろくにじゅうに",3:"ろくさんじゅうはち",4:"ろくしにじゅうし",5:"ろくごさんじゅう",6:"ろくろくさんじゅうろく",7:"ろくしちしじゅうに",8:"ろく はしじゅうはち",9:"ろっくごじゅうし"},
    7: {1:"しちいちがしち",2:"しちにじゅうし",3:"しちさんにじゅういち",4:"しちしにじゅうはち",5:"しちごさんじゅうご",6:"しちろくしじゅうに",7:"しちしちしじゅうく",8:"しち はごじゅうろく",9:"しちくろくじゅうさん"},
    8: {1:"はちいちがはち",2:"はちにじゅうろく",3:"はちさんにじゅうし",4:"はちしさんじゅうに",5:"はちごしじゅう",6:"はちろくしじゅうはち",7:"はちしちごじゅうろく",8:"はっぱろくじゅうし",9:"はっくしちじゅうに"},
    9: {1:"くいちがく",2:"くにじゅうはち",3:"くさんにじゅうしち",4:"くしさんじゅうろく",5:"くごしじゅうご",6:"くろくごじゅうし",7:"くしちろくじゅうさん",8:"く はしちじゅうに",9:"くくはちじゅういち"}
  };
  // 答えの読み（連声は答えには入らない）
  const KU_DIGIT = ["", "いち", "に", "さん", "し", "ご", "ろく", "しち", "はち", "く"];
  function prodKana(n) {
    if (n <= 9) return KU_DIGIT[n];
    if (n === 10) return "じゅう";
    const t = Math.floor(n / 10), o = n % 10;
    return (t === 1 ? "じゅう" : KU_DIGIT[t] + "じゅう") + (o > 0 ? KU_DIGIT[o] : "");
  }
  // 出題時：答えを言わず、因数部だけを読み上げ（答え1桁のときは「が」付き、2桁以上は「が」なし）
  function kukuQuestion(a, b) {
    const s = KUKU[a][b];
    if (s.includes("が")) return s.slice(0, s.indexOf("が") + 1);
    return s.slice(0, s.length - prodKana(a * b).length);
  }
  // 正解時・誤答時：正答ごと読み上げ
  function kukuFact(a, b) {
    return KUKU[a][b];
  }
  let muted = false;
  function speakKuku(a, b) {
    if (muted) return;
    speak(kukuQuestion(a, b));
  }
  function speakFact(a, b, onend) {
    if (muted) { if (onend) onend(); return; }
    speak(kukuFact(a, b), onend);
  }

  // 日本語音声の選択（getVoices は非同期で読み込まれるため voiceschanged を待つ）
  let jpVoice = null;
  function pickJapaneseVoice() {
    try {
      const vs = window.speechSynthesis.getVoices() || [];
      if (!vs.length) return;
      const jp = vs.filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("ja"));
      if (!jp.length) return;
      // 確実に動作する「デフォルトの日本語音声」を優先（名前指定だと端末によっては無音になるため）
      jpVoice = jp.find(v => v.default) || jp[0];
    } catch (e) { jpVoice = null; }
  }
  function speak(text, onend) {
    try {
      if (!window.speechSynthesis) { if (onend) onend(); return; }
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      u.rate = 0.92;
      u.pitch = 1.05;
      if (jpVoice) u.voice = jpVoice;
      u.onerror = () => { if (onend) onend(); };
      u.onend = () => { if (onend) onend(); };
      window.speechSynthesis.speak(u);
    } catch (e) { if (onend) onend(); }
  }
  if (window.speechSynthesis) {
    pickJapaneseVoice();
    window.speechSynthesis.onvoiceschanged = pickJapaneseVoice;
    // 初回のユーザー操作で TTS をアンロック（iOS / Android で必要）
    const primeTTS = () => {
      try {
        const u = new SpeechSynthesisUtterance("");
        u.volume = 0;
        window.speechSynthesis.speak(u);
        window.speechSynthesis.cancel();
      } catch (e) {}
    };
    ["pointerdown", "touchstart", "keydown", "click"].forEach(ev =>
      window.addEventListener(ev, primeTTS, { once: true, passive: true })
    );
  }

  // ============ Web Audio 効果音・BGM ============
  let audioCtx = null;
  function initAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function note(freq, dur, type, vol, delay) {
    try {
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime + (delay || 0);
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function drum(vol, delay) {
    try {
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime + (delay || 0);
      const n = Math.floor(audioCtx.sampleRate * 0.08);
      const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
      g.gain.value = vol || 0.25;
      src.buffer = buf; src.connect(g).connect(audioCtx.destination);
      src.start(t0);
      note(90, 0.12, "sine", (vol || 0.25) * 1.5, delay || 0);
    } catch (e) {}
  }
  const SFX = {
    click: () => { note(660, 0.06, "sine", 0.15); },

    wrong: () => { note(220, 0.2, "sawtooth", 0.12); note(160, 0.3, "sawtooth", 0.12, 0.12); },
    bossHit: () => { drum(0.4); note(140, 0.15, "square", 0.18); },
    heartLost: () => { note(300, 0.25, "sawtooth", 0.15, 0); note(180, 0.35, "sawtooth", 0.15, 0.15); },
    clear: () => { [523,659,784,1047,784,1047].forEach((f,i)=>note(f,0.16,"triangle",0.2,i*0.1)); drum(0.3, 0.5); },
    card: () => { [659,880,1100,1320].forEach((f,i)=>note(f,0.12,"triangle",0.2,i*0.06)); },
    medal: () => { [784,988,1175].forEach((f,i)=>note(f,0.1,"sine",0.2,i*0.05)); },
    bgmNote: null
  };
  const BGM_PENTA = [262, 294, 330, 392, 440, 523];
  // 通常：忍者ぽい和風アルペジオ（ヨナ抜き音階）
  const BGM_NORMAL = [262, 330, 392, 330, 294, 392, 440, 392];
  // ボス：攻撃的で緊張感のあるフレーズ
  const BGM_BOSS = [392, 440, 523, 440, 392, 330, 392, 466];
  let bgmTimer = null, bgmStep = 0, bgmMode = "normal";
  function startBGM(mode) {
    initAudio();
    mode = mode || "normal";
    if (bgmTimer && bgmMode === mode) return;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    bgmMode = mode;
    bgmStep = 0;
    const seq = mode === "boss" ? BGM_BOSS : BGM_NORMAL;
    const tempo = mode === "boss" ? 165 : 230;
    bgmTimer = setInterval(() => {
      if (!audioCtx || audioCtx.state !== "running") return;
      const f = seq[bgmStep % seq.length];
      if (mode === "boss") {
        // 低音のドス + 鋭いメロディ
        note(f, 0.16, "square", 0.05);
        if (bgmStep % 2 === 0) { note(98, 0.18, "sawtooth", 0.06); drum(0.22); }
      } else {
        note(f, 0.34, "triangle", 0.05);
        if (bgmStep % 4 === 0) drum(0.08);
      }
      bgmStep++;

  }

  // ============ 状態 ============
  const SAVE_KEY = "sansuNinjaData";

  function loadData() {
    const tryParse = (raw) => { try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
    try { const r = tryParse(localStorage.getItem(SAVE_KEY)); if (r) return r; } catch (e) {}
    try { const r = tryParse(sessionStorage.getItem(SAVE_KEY)); if (r) return r; } catch (e) {}
    try { if (window.name && window.name.indexOf("SN:") === 0) { const r = tryParse(window.name.slice(3)); if (r) return r; } } catch (e) {}
    return {};
  }
  function saveData() {
    const data = JSON.stringify({ players });
    try { localStorage.setItem(SAVE_KEY, data); } catch (e) {}
    try { sessionStorage.setItem(SAVE_KEY, data); } catch (e) {}
    try { window.name = "SN:" + data; } catch (e) {}
    try { if (saveChannel) saveChannel.postMessage({ type: "save", players }); } catch (e) {}
  }

  let saveChannel = null;

  if (saveChannel) {
    saveChannel.onmessage = (ev) => {
      try {
        if (ev.data && ev.data.type === "save" && Array.isArray(ev.data.players)) {
          players = ev.data.players;
          if (currentPlayer && !playerByName(currentPlayer)) currentPlayer = players.length ? players[0].name : null;
        }
      } catch (e) {}
    };
  }
  window.addEventListener("storage", (e) => {

  function playerByName(name) {

  function danProgress(p) {
    const prog = {};
    for (let d = 1; d <= 9; d++) {

  // ============ 出題 ============
  function genChoices(correct) {
    const opts = new Set([correct]);
    while (opts.size < 3) {
      let w;
      const r = Math.random();
      if (r < 0.4) {
        w = correct + (Math.floor(Math.random() * 5) - 2);
      } else if (r < 0.7) {
        w = correct + (Math.floor(Math.random() * 3) + 1) * dan;
      } else {
        w = Math.floor(Math.random() * (dan * 9)) + dan;
      }
      if (w > 0 && w !== correct) opts.add(w);
    }
    const arr = Array.from(opts);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuestion() {
    const stage = STAGES[stageIdx];

    isBoss = stage.key === "boss";

  }

  function nextQuestion() {
    const stage = STAGES[stageIdx];
    // 通常ステージ：count 問出たらクリア
    if (!isBoss && answeredInStage >= stage.count) {
      finishStage();
      return;
    }
    // ボス：HP 0 でクリア
    if (isBoss && bossHp <= 0) {
      finishStage();
      return;
    }
    const a = dan;
    let b;
    if (stage.mode === "sequence") {
      b = (answeredInStage % 9) + 1;
    } else {
      b = Math.floor(Math.random() * 9) + 1;
    }
    const correct = a * b;
    question = { a, b, correct, choices: genChoices(correct) };
    renderPlay();
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    s.classList.toggle("bossfight", isBoss);
    // 出題時に九九を読み上げ（問題のみ）
    speakKuku(question.a, question.b);
  }

  function spawnShuriken() {
    const zone = screens.playScreen.querySelector(".enemy-zone");
    if (!zone) return;
    const sh = document.createElement("div");
    sh.className = "shuriken-fly";
    sh.innerHTML = `<svg viewBox="0 0 100 100" width="42" height="42"><path d="M50 3 L60 42 L97 50 L60 58 L50 97 L40 58 L3 50 L40 42 Z" fill="#cfd8dc" stroke="#5d6d7e" stroke-width="4" stroke-linejoin="round"/></svg>`;
    const r = zone.getBoundingClientRect();
    const dx = (r.width / 2) * (Math.random() * 0.4 - 0.2);
    const dy = -Math.max(120, r.height * 0.35);
    sh.style.setProperty("--dx", dx + "px");
    sh.style.setProperty("--dy", dy + "px");
    zone.appendChild(sh);
    setTimeout(() => sh.remove(), 500);
    const sl = document.createElement("div");
    sl.className = "slash";
    sl.textContent = "💥";
    zone.appendChild(sl);
    setTimeout(() => sl.remove(), 500);
  }

  function updateBossBar() {
    const fill = document.getElementById("bossBar");
    if (fill) fill.style.width = (bossHp / BOSS_HP * 100) + "%";
  }

  function answer(idx, btnEl) {
    if (!question) return;
    const stage = STAGES[stageIdx] || { key: "bonus" };
    const chosen = question.choices[idx];
    const isCorrect = chosen === question.correct;
    answeredInStage++;
    const fb = document.getElementById("feedback");
    const enemy = document.getElementById("enemyEmoji");
    const pad = document.getElementById("choicePad");
    const hudLives = document.getElementById("hudLives");
    const p = ensurePlayer(currentPlayer);

    // 記録（ボーナスは記録しない）
    let rec = null;
    if (!isBonus) rec = p.records[dan] = p.records[dan] || { correct: 0, wrong: 0, stages: {}, medals: [] };

    // 選択肢のフィードバック表示
    sLock();
    pad.classList.add("disabled");
    btnEl.classList.add(isCorrect ? "correct" : "wrong");
    question.choices.forEach((c, i) => {
      if (c === question.correct) pad.querySelector('[data-idx="' + i + '"]').classList.add("correct");
    });

    if (isCorrect) {
      SFX.correct();
      streak++;
      totalCorrect++;
      if (rec) rec.correct++;
      fb.textContent = streak >= 2 ? "れんぞく" + streak + "せいかい！" : "せいかい！";
      fb.className = "feedback show good";
      if (enemy) { enemy.classList.add("hit"); setTimeout(() => enemy.classList.remove("hit"), 400); }
      spawnShuriken();
      // 正解時：その九九を答えまで含めて読み上げ、終わってから次へ進む
      // onend が発火しない環境でも必ず進行するため、ガード付き goNext ＋フォールバックタイマー
      const goNext = (() => {
        let done = false;
        return () => {
          if (done) return;
          done = true;
          sUnlock();
          if (isBonus) { nextBonusQuestion(); }
          else { nextQuestion(); }
        };
      })();
      if (isBoss) {
        bossHp--;
        SFX.bossHit();
        if (enemy) { enemy.classList.add("hurt"); setTimeout(() => enemy.classList.remove("hurt"), 500); }
        updateBossBar();
        setTimeout(() => {
          if (bossHp <= 0) { finishStage(); return; }
          speakFact(question.a, question.b, goNext);
          setTimeout(goNext, 3000);
        }, 750);
      } else {
        setTimeout(() => {
          speakFact(question.a, question.b, goNext);
          setTimeout(goNext, 3000);
        }, 650);
      }
      setTimeout(() => fb.classList.remove("show"), 700);
    } else {
      SFX.wrong();
      streak = 0;
      mistakes++;
      totalWrong++;
      if (rec) rec.wrong++;
      lives--;
      fb.textContent = "ざんねん… せいかいは " + question.a + " × " + question.b + " ＝ " + question.correct + " だよ";
      fb.className = "feedback show bad";
      if (enemy) { enemy.classList.add("hurt"); setTimeout(() => enemy.classList.remove("hurt"), 500); }
      if (hudLives) hudLives.innerHTML = "♥".repeat(Math.max(0, lives)) + "♡".repeat(PLAYER_LIVES - Math.max(0, lives));
      // 正しい九九の読みを聞かせる（間違えた時こそ正しく覚えてほしい／タップ内で再生）
      speakFact(question.a, question.b);
      // おにぎり学習へ
      setTimeout(() => {
        showLearn();
      }, 900);
    }
  }

  // ============ ステージ終了 ============
  function finishStage() {
    stopSpeak();
    const p = ensurePlayer(currentPlayer);
    const stage = STAGES[stageIdx];
    const m = MASTERS[dan];
    const rec = p.records[dan] = p.records[dan] || { correct: 0, wrong: 0, stages: {}, medals: [] };
    // ステージクリア記録
    rec.stages[stage.key] = true;

    // メダル判定（ボス以外）
    let medal = null;
    if (stage.key !== "boss") {
      medal = mistakes === 0 ? "gold" : mistakes === 1 ? "silver" : "bronze";
      rec.medals.push(medal);
      if (rec.medals.length > 3) rec.medals.shift();
    }

    // カード獲得：その段の「修行＋実践×2」をクリアすればボス抜きでもゲット！
    const recStages = (p.records[dan] && p.records[dan].stages) || {};
    const nonBoss = STAGES.filter(s => s.key !== "boss");
    const doneNonBoss = nonBoss.every(s => recStages[s.key]);
    const doneAll = danProgress(p)[dan] >= STAGES.length;
    const isComplete = doneAll;
    let newCard = null;
    if ((doneNonBoss || doneAll) && !p.cards[dan]) {
      p.cards[dan] = true;
      newCard = { dan, name: m.name };
    }
    saveData();

    // 段完了後、ボーナスチェック
    const allCleared = danProgress(p)[1] >= 4 && danProgress(p)[2] >= 4 && danProgress(p)[3] >= 4 &&
      danProgress(p)[4] >= 4 && danProgress(p)[5] >= 4 && danProgress(p)[6] >= 4 &&
      danProgress(p)[7] >= 4 && danProgress(p)[8] >= 4 && danProgress(p)[9] >= 4;

    show("clearScreen");
    const s = screens.clearScreen;
    s.innerHTML = `
      <div class="clear-emoji">${isComplete ? "🏆" : "🎉"}</div>
      <div class="clear-title">${isComplete ? dan + "の段 クリア！" : stage.label + " クリア！"}</div>
      ${isComplete ? `<div class="card-reward ${newCard ? "" : "hidden"}">
          <div class="c-emoji">${newCard ? makeNinja(newCard.dan, 70) : ""}</div>
          <div>
            <div class="c-name">${newCard ? newCard.name + " のカード！" : ""}</div>
          </div>
          <div class="c-new">NEW!</div>
        </div>` : ""}
      ${medal ? `<div class="medal-row">
          <div class="medal bronze">🥉</div>
          <div class="medal silver">🥈</div>
          <div class="medal gold">🥇</div>
        </div>` : ""}
      <div class="stage-progress" id="stageProg"></div>
      <div class="footer-nav">
        <button class="btn big" id="btnNext">つぎへ！</button>
      </div>
    `;
    // ステージ進行表示
    const prog = s.querySelector("#stageProg");
    STAGES.forEach((st, i) => {
      const d = document.createElement("div");
      d.className = "stage-dot" + (rec.stages[st.key] ? " done" : (i === stageIdx ? " now" : " lock"));
      prog.appendChild(d);
    });

    if (medal) {
      const medalMap = { bronze: 0, silver: 1, gold: 2 };
      const idx = medalMap[medal];
      SFX.medal();
      // 獲得メダルをハイライト
      const medals = s.querySelectorAll(".medal");
      setTimeout(() => { medals[idx].style.transform = "scale(1.4)"; }, 600);
    }
    if (newCard) { SFX.card(); }
    SFX.clear();

    const btn = s.querySelector("#btnNext");
    if (isComplete) {
      btn.textContent = allCleared ? "ミックス修行へ！" : "つぎの段へ！";
    } else if (stageIdx < 3) {
      btn.textContent = "つぎのステージへ！";
    } else {
      btn.textContent = "ボス戦へ！";
    }
    btn.addEventListener("click", () => {
      SFX.click();
      if (isComplete) {
        if (allCleared) { showBonus(); return; }
        stageIdx = 0;
        dan++;
        if (dan > 9) { showBonus(); return; }
        startStage();
      } else {
        stageIdx++;
        startStage();
      }
    });
  }

  function renderRecord() {

    show("recordScreen");
    const s = screens.recordScreen;
    s.innerHTML = `
      <div class="topbar">

      </div>
    `;
    const p = ensurePlayer(currentPlayer);
    const wrap = s.querySelector("#recWrap");

    // 苦手な段の判定（不正解率が高い）
    let worst = null, worstRate = -1;
    for (let d = 1; d <= 9; d++) {
      const r = p.records[d];
      if (!r) continue;
      const total = r.correct + r.wrong;
      if (total < 3) continue;
      const rate = r.wrong / total;
      if (rate > worstRate) { worstRate = rate; worst = d; }
    }
    if (worst) {
      const note = document.createElement("div");
      note.className = "weak-note";
      note.textContent = "⚠ がんばりどころ： " + worst + "の段（" + MASTERS[worst].name + "）";
      wrap.appendChild(note);
    }
    let totalC = 0, totalW = 0;
    for (let d = 1; d <= 9; d++) {
      const r = p.records[d];
      const m = MASTERS[d];
      const done = (r && r.stages) ? STAGES.filter(st => r.stages[st.key]).length : 0;
      const medals = (r && r.medals) || [];
      const c = (r && r.correct) || 0;
      const w = (r && r.wrong) || 0;
      totalC += c; totalW += w;
      const card = document.createElement("div");
      card.className = "record-card";
      const maxBar = Math.max(c + w, 1);
      card.innerHTML = `
        <div class="row-head">
          <span class="dan-name">${makeNinja(d, 30)} ${d}の段 ${m.name}</span>
          <span class="medals">${medals.map(x => x === "gold" ? "🥇" : x === "silver" ? "🥈" : "🥉").join("")}${done >= 4 ? "🏆" : " (" + done + "/4)"}</span>
        </div>
        <div class="bars">
          <div class="bar-row"><span class="lbl">せいかい</span><div class="bar-bg"><div class="bar good" style="width:${c / maxBar * 100}%"></div></div><span class="val">${c}</span></div>
          <div class="bar-row"><span class="lbl">まちがい</span><div class="bar-bg"><div class="bar bad" style="width:${w / maxBar * 100}%"></div></div><span class="val">${w}</span></div>
        </div>
      `;
      wrap.appendChild(card);
    }
    const total = document.createElement("div");
    total.className = "record-card";
    total.innerHTML = `<div class="row-head"><span class="dan-name">合計</span><span style="color:var(--green)">せいかい ${totalC}</span><span style="color:var(--red)">まちがい ${totalW}</span></div>`;
    wrap.appendChild(total);

    s.querySelector("#btnRecBack").addEventListener("click", () => { SFX.click(); renderSlots(); });
    s.querySelector("#btnRecHome").addEventListener("click", () => { SFX.click(); renderSlots(); });
  }

  // ============ 初期化 ============
  function init() {
    setup();
    renderTitle();
  }
  document.addEventListener("DOMContentLoaded", init);
  if (document.readyState !== "loading") init();

  // ============ BGM 開始（ユーザー操作後に） ============
  document.addEventListener("pointerdown", () => { initAudio(); startBGM(); }, { once: true });
})();
</script>
</body>
</html>
