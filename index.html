<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ゲームメニュー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0e27;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eaf0ff; overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .menu { text-align: center; padding: 6vw; max-width: 560px; }
  h1 { font-size: 8vw; margin-bottom: 6vw; letter-spacing: 2px; }
  a.play {
    display: block; width: 80%; max-width: 420px; margin: 4vw auto;
    padding: 5vw; font-size: 5vw; font-weight: 700; text-decoration: none;
    color: #fff; border-radius: 999px;
    box-shadow: 0 6px 20px rgba(74,140,255,0.35);
    background: linear-gradient(135deg,#4a8cff,#7d5bff);
  }
  a.play:active { transform: scale(0.97); }
  .qr-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 6vw; }
  .qr { background: #fff; border-radius: 14px; padding: 8px; }
  .qr img { display: block; width: 34vw; max-width: 160px; height: auto; }
  .qr .cap { color: #0a0e27; font-size: 3.4vw; font-weight: 700; margin-top: 4px; }
  .note { font-size: 3.2vw; opacity: 0.7; margin-top: 6vw; line-height: 1.6; }
  .url { font-size: 3.4vw; word-break: break-all; opacity: 0.85; }
</style>
</head>
<body>
  <div class="menu">
    <h1>ゲーム館</h1>
    <a class="play" href="arkanoid/">🧱 アルカノイド風</a>
    <a class="play" href="kakezan/">⭐ 算数忍者（かけ算）</a>

    <div class="qr-row">
      <div class="qr">
        <img src="assets/qr_arkanoid.png" alt="arkanoid qr">
        <div class="cap">アルカノイド</div>
      </div>
      <div class="qr">
        <img src="assets/qr_kakezan.png" alt="kakezan qr">
        <div class="cap">算数忍者</div>
      </div>
    </div>

    <p class="url">https://income-trout-fall-political.trycloudflare.com/arkanoid/<br>https://income-trout-fall-political.trycloudflare.com/kakezan/</p>
    <p class="note">共有方法：この2つのURLをそのまま送るか、上のQRをスマホで読み取ってください。<br>
    IP入力やパスワードは不要です。URLを知っている人だけが開けます（限定公開）。<br>
    リンクは Mac の電源が入り、このトンネルが起動している間のみ有効です。</p>
  </div>
</body>
</html>
